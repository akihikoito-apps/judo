name: Android 選手アプリ → AAB

# GitHubのLinux環境でAndroid用の配布ファイル（AAB）を作ります。Macは不要で、
# 公開リポジトリなのでLinuxランナーの利用料はかかりません（macOSより速く・安い）。
#
# 【いまの状態】署名なしのAABを成果物として残すところまで。
# Google Play へ自動アップロードする工程は、Play Console の登録と
# サービスアカウント鍵ができてから追加します（下部のコメント参照）。
#
# 追加で必要になるGitHubシークレット（Play登録後）
#   ANDROID_KEYSTORE_B64   … 署名鍵(.jks)をbase64にしたもの
#   ANDROID_KEYSTORE_PASS  … キーストアのパスワード
#   ANDROID_KEY_ALIAS      … 鍵のエイリアス
#   ANDROID_KEY_PASS       … 鍵のパスワード
#   PLAY_SERVICE_ACCOUNT   … Google Play API のサービスアカウントJSON

on:
  workflow_dispatch:
  push:
    branches: [main, android-prep]
    paths:
      - 'native/player/**'
      - 'native/build-www.js'
      - 'index.html'
      - 'build.js'
      - '.github/workflows/android-player.yml'

concurrency:
  group: android-player
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js を用意
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/player/package-lock.json

      - name: Java を用意（Androidのビルドに必要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK を用意
        uses: android-actions/setup-android@v4

      - name: 依存パッケージを入れる
        working-directory: native/player
        run: npm ci --no-audit --no-fund

      - name: ビルド番号を設定（GitHubの実行番号を使う）
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" \
            native/player/android/app/build.gradle
          grep -n "versionCode\|versionName" native/player/android/app/build.gradle

      - name: www を生成して Android 側へ同期
        working-directory: native/player
        run: |
          node ../build-www.js player
          npx cap sync android
          test -f android/app/src/main/assets/public/index.html || { echo "::error::wwwがコピーされていません"; exit 1; }

      - name: 署名鍵を用意（シークレットがあるときだけ）
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
            test -s "$RUNNER_TEMP/upload-keystore.jks" || { echo "::error::鍵の取り出しに失敗しました"; exit 1; }
            echo "path=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_OUTPUT"
            echo "::notice::署名鍵を読み込みました（署名ありで作ります）"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 が未設定です。署名なしで作ります（Play には出せません）"
          fi

      - name: AAB と APK を作る
        working-directory: native/player/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -aE "error:|FAILURE|What went wrong|Could not|Execution failed" /tmp/gradle.log | tail -10 > /tmp/e.txt
            [ -s /tmp/e.txt ] || tail -10 /tmp/gradle.log > /tmp/e.txt
            n=0
            while IFS= read -r line; do
              n=$((n+1)); [ "$n" -gt 10 ] && break
              echo "::error::GRADLE $(printf '%s' "$line" | tr -d '\r' | cut -c1-400)"
            done < /tmp/e.txt
          fi
          exit $code

      - name: できあがりを確認（署名も見る）
        run: |
          f=$(find native/player/android -name "*.aab" | head -1)
          echo "::notice::AAB=$f ($(du -h "$f" | cut -f1))"
          a=$(find native/player/android -name "*.apk" | head -1)
          echo "::notice::APK=$a ($(du -h "$a" | cut -f1))"
          case "$a" in
            *unsigned*) echo "::warning::APK が未署名です（シークレット未設定）";;
            *)
              signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
              if [ -n "$signer" ]; then
                "$signer" verify --print-certs "$a" | tee /tmp/sig.txt
                grep -q "SHA-256 digest: ac180fdbda146b1e8a03f435226e90929448577fb37ff0a33dbaeb2a677cd5c4" /tmp/sig.txt || { echo "::error::APK の署名が想定の鍵と違います"; exit 1; }
                echo "::notice::署名を確認しました（アップロード鍵 Aki-TT）"
              fi
              ;;
          esac

      - name: AAB を保存
        uses: actions/upload-artifact@v4
        with:
          name: player-aab
          path: native/player/android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      # 実機（moto g06）に入れて動作確認するための APK。Play には出さない。
      - name: APK を保存（実機確認用）
        uses: actions/upload-artifact@v4
        with:
          name: player-apk
          path: native/player/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: 失敗時：ログを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: player-gradle-log
          path: /tmp/gradle.log
          if-no-files-found: ignore
          retention-days: 7

