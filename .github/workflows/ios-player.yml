name: iOS 選手アプリ → TestFlight

# GitHubのmacOS環境でビルドし、App Store Connect（TestFlight）へ直接アップロードします。
# Macは不要です。公開リポジトリなのでmacOSランナーの利用料はかかりません。
#
# 必要なGitHubシークレット（Settings › Secrets and variables › Actions）
#   ASC_KEY_ID     … App Store Connect APIキーの「キーID」
#   ASC_ISSUER_ID  … 同じページ上部にある「Issuer ID」
#   ASC_KEY_P8     … ダウンロードした .p8 ファイルの中身をそのまま貼り付け
#   APPLE_TEAM_ID  … Apple DeveloperのMembershipにある「Team ID」

on:
  workflow_dispatch:          # GitHubの画面から手動で実行できる
  push:
    branches: [main]
    paths:
      - 'native/player/**'
      - 'native/build-www.js'
      - 'native/ci-set-team.js'
      - 'index.html'
      - 'build.js'
      - '.github/workflows/ios-player.yml'

concurrency:
  group: ios-player
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_DIR: native/player
      EDITION: player
      WORKSPACE: native/player/ios/App/App.xcworkspace
      ARCHIVE: /tmp/App.xcarchive
      KEYDIR: /tmp/private_keys

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: シークレットが入っているか先に確認
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ng=0
          check() { if [ -z "$2" ]; then echo "::error::シークレット $1 が未設定です"; ng=1; else echo "$1 … OK (${#2}文字)"; fi; }
          check ASC_KEY_ID    "$ASC_KEY_ID"
          check ASC_ISSUER_ID "$ASC_ISSUER_ID"
          check ASC_KEY_P8    "$ASC_KEY_P8"
          check APPLE_TEAM_ID "$APPLE_TEAM_ID"
          case "$ASC_KEY_P8" in
            *"BEGIN PRIVATE KEY"*) echo "ASC_KEY_P8 … 鍵の形式OK" ;;
            *) echo "::error::ASC_KEY_P8 に -----BEGIN PRIVATE KEY----- が見当たりません。.p8の中身を全文貼り直してください"; ng=1 ;;
          esac
          exit $ng

      - name: 環境を表示
        run: |
          xcodebuild -version
          pod --version

      - name: Node.js を用意
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: native/player/package-lock.json

      - name: 依存パッケージを入れる
        working-directory: native/player
        run: npm ci --no-audit --no-fund

      - name: ビルド番号を設定（GitHubの実行番号を使う）
        run: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/g" \
            native/player/ios/App/App.xcodeproj/project.pbxproj
          grep -m1 CURRENT_PROJECT_VERSION native/player/ios/App/App.xcodeproj/project.pbxproj

      - name: www を生成して iOS 側へ同期（pod install もここで走る）
        working-directory: native/player
        run: |
          node ../build-www.js player
          npx cap sync ios
          test -f ios/App/Podfile.lock || { echo "::error::Podfile.lock がありません（pod install が走っていません）"; exit 1; }
          test -d ios/App/Pods         || { echo "::error::Pods ディレクトリがありません"; exit 1; }

      - name: App Store Connect の APIキーを書き出す
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$KEYDIR"
          printf '%s\n' "$ASC_KEY_P8" > "$KEYDIR/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$KEYDIR/AuthKey_${ASC_KEY_ID}.p8"
          head -c 30 "$KEYDIR/AuthKey_${ASC_KEY_ID}.p8"; echo " ...（先頭だけ表示）"

      - name: 署名設定を整える（チームID・固定identityの除去）
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node native/ci-set-team.js player

      - name: アーカイブ（署名はここではせず、書き出し時に配布用で署名する）
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set +e
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEYDIR/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee /tmp/archive.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "===== 失敗。エラー行を抜き出します ====="
            grep -aE "error:|No profiles|No signing certificate|requires a development team|Communication with Apple|Provisioning profile|Failed to (register|create)|Unable to|not available" /tmp/archive.log | tail -10 > /tmp/errs.txt
            [ -s /tmp/errs.txt ] || tail -10 /tmp/archive.log > /tmp/errs.txt
            n=0
            while IFS= read -r line; do
              n=$((n+1)); [ "$n" -gt 10 ] && break
              echo "::error::ARCHIVE $(printf '%s' "$line" | tr -d '\r' | cut -c1-400)"
            done < /tmp/errs.txt
          fi
          exit $code

      - name: 失敗時：ビルドログを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: player-archive-log
          path: /tmp/archive.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 書き出し設定を作る
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          cat /tmp/ExportOptions.plist

      - name: 配布用に署名してTestFlightへアップロード
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set +e
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath /tmp/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEYDIR/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee /tmp/export.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "===== 失敗。エラー行を抜き出します ====="
            grep -aE "error:|No profiles|No signing certificate|Communication with Apple|Provisioning profile|Failed to|Unable to|not available|denied" /tmp/export.log | tail -10 > /tmp/eerrs.txt
            [ -s /tmp/eerrs.txt ] || tail -10 /tmp/export.log > /tmp/eerrs.txt
            n=0
            while IFS= read -r line; do
              n=$((n+1)); [ "$n" -gt 10 ] && break
              echo "::error::EXPORT $(printf '%s' "$line" | tr -d '\r' | cut -c1-400)"
            done < /tmp/eerrs.txt
          fi
          exit $code

      - name: 失敗時：書き出しログを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: player-export-log
          path: /tmp/export.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 完了メッセージ
        run: echo "TestFlightへのアップロードが完了しました。処理に5〜15分かかることがあります。"
